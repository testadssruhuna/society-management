  <body>
    <!-- Instant pre-React auth check: redirect /login to dashboard if already logged in -->
    <script>
      (function() {
        // Set background instantly from cached theme to prevent white flash
        var theme = localStorage.getItem('theme') || 'dark';
        document.documentElement.style.background = theme === 'dark' ? '#08090a' : '#fafafa';

        // If visiting /login or /register and already have a cached session, redirect immediately (before React loads)
        var path = window.location.pathname;
        if (path === '/login' || path === '/register') {
          try {
            var auth = localStorage.getItem('adss-auth');
            var profile = localStorage.getItem('adss-profile-cache');
            if (auth && JSON.parse(auth).user && profile) {
              window.location.replace('/');
            }
          } catch(e) {}
        }
      })();
    </script>
    <div id="root"></div>

    <!-- Service Worker Registration & Auto-Update -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((reg) => {
              console.log('[PWA] Service Worker registered, scope:', reg.scope);
              
              // Force check for updates on every page refresh
              reg.update();

              // Auto-refresh page when a new app build/service worker is installed
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[PWA] New version detected & installed. Refreshing app...');
                      window.location.reload();
                    }
                  };
                }
              };
            })
            .catch((err) => {
              console.warn('[PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>
